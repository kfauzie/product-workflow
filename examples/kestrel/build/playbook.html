<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gusta support playbook (fictional example)</title>
<!-- FICTIONAL example: Gusta and its playbook are synthetic. Rules come from ../data/support_playbook.json (made by ../notebooks/make_data.py). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--text:#343a40;--head:#212529;--mute:#6c757d;--line:#e6e8eb;--bg:#f9f9fa;--mix-bg:#fff4e0;--mix:#9a5b00;--info:#1f5f99}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:15px;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:28px 24px 20px}
h1{font-size:24px;color:var(--head);margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 18px}
section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 18px 10px;margin:0 0 14px}
h2{font-size:16px;color:var(--head);margin:10px 0 4px}
.rule{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:8px 10px;margin:0 -10px;border-radius:6px;border-left:3px solid transparent;scroll-margin-top:24px}
.rule a{font-weight:600;color:var(--info);text-decoration:none;font-variant-numeric:tabular-nums}
.rule:target,.rule.hit{background:var(--mix-bg);border-left-color:var(--mix)}
footer{color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:20px}
</style></head>
<body><main>
<h1 id="title">Support playbook</h1>
<p class="lead" id="lead"></p>
<div id="rules"></div>
<footer id="footer"></footer>
</main>
<script>
fetch('../data/support_playbook.json').then(r => r.json()).then(d => {
  const G = d.customer;
  document.getElementById('title').textContent = `${G} customer support playbook`;
  document.getElementById('lead').textContent = `The rules Kestrel follows when it answers ${G}'s customers. A separate grading AI checks every answer against them.`;
  document.getElementById('rules').innerHTML = d.sections.map(s => `<section><h2>${s.name}</h2>${s.rules.map(r =>
    `<div class="rule" id="${r.id}"><a href="#${r.id}">${r.id}</a><span>${r.rule}</span></div>`).join('')}</section>`).join('');
  document.getElementById('footer').textContent = `Fictional example: ${G}, its playbook and all data are synthetic.`;
  // opened from a rule link: bring that rule into view and highlight it
  const go = () => { document.querySelectorAll('.rule.hit').forEach(e => e.classList.remove('hit'));
    const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) { el.classList.add('hit'); el.scrollIntoView({block: 'start'}); } };
  window.addEventListener('hashchange', go); go(); document.body.dataset.ready = '1';
}).catch(() => { document.getElementById('lead').innerHTML = '<b>Couldn\'t load the playbook.</b> Open this page through a web server, not by double-clicking the file.'; });
</script>
</body></html>
