<style>

body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}

<main>
<div class="intro" id="intro"></div>
<dl class="header" id="header"></dl>
<h1 id="headline"></h1>
<div class="dash-head" id="dashHead"></div>
<div class="summary" id="summary"></div>
<div class="panel rules" id="rules"></div>
<div class="bar" style="justify-content:flex-end"><button class="apply" id="applyAll" onclick="applyAll()">Apply all recommendations</button></div>

</main>

<script id="calc">
// ---- Every number is calculated here. Plain functions, tested in test_mvp.js ----
// modes: 'resolve' = AI, 'draft' = AI-assisted human, 'human' = Human
const RANK = {human: 0, draft: 1, resolve: 2};
function accuracy(t){ return t.correct / t.tested; }
function recommend(t, n){
  const a = accuracy(t, n), high = t.risk === 'High';
  if (a >= 0.98 && !high) return 'resolve';
  if (a >= 0.60) return 'draft';  // a support agent checks every draft, so risk only matters for sending unchecked
  return 'human';
}
// settings: one mode per type (defaults to the recommendation)
function summary(d, settings){
  const n = 0, all = d.types.reduce((s, t) => s + t.tickets, 0);
  let ai = 0, assisted = 0, wrong = 0, wrongHigh = 0;
  d.types.forEach((t, i) => { const m = settings[i];
    if (m === 'resolve'){ const w = t.tickets * (1 - accuracy(t, n)); ai += t.tickets; wrong += w; if (t.risk === 'High') wrongHigh += w; }
    if (m === 'draft') assisted += t.tickets; });
  return {all, ai, assisted, aiShare: ai / all, hours: (ai * d.minutes_ai + assisted * d.minutes_assisted) / 60, wrong, wrongHigh};
}
function aboveRecommended(t, n, mode){ return RANK[mode] > RANK[recommend(t, n)]; }
function wrongPerMonth(t){ return Math.round(t.tickets * (1 - accuracy(t))); }
// live accuracy ticker: only types measured on live tickets can move; the higher a row sits in the table, the more often it is picked
function tickerWeights(types){ return types.map((t, i) => t.tested === t.tickets ? 1 / (i + 1) : 0); }
if (typeof module !== 'undefined') module.exports = {accuracy, recommend, summary, aboveRecommended, wrongPerMonth, tickerWeights, RANK};
</script>

<script>
const LABEL = {resolve: 'AI', draft: 'AI-assisted human', human: 'Human'};
// impact if wrong: how hard a wrong answer is to undo (stored as Low, Medium, High)
const IMPACT = {Low: 'Easy to fix', Medium: 'Fixable', High: 'Hard to undo'};
let D, settings = [], risks = [], open = new Set([0]);
let liveCorrect = [], accFlash = {}, ovr = {};  // ovr: your verdict overrides, '<type>-<ticket>' -> {correct, reason}
const eff = () => D.types.map((t, i) => Object.assign({}, t, {risk: risks[i], correct: liveCorrect[i]}));
const fmt = v => Math.round(v).toLocaleString('en-GB');
// small line icons (inline SVG, inherit the text colour)
const ICON = {
  customer: '<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 10h.01M15 10h.01"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  job: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13h.01M15 13h.01M9 17h6"/>',
  page: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 16v-4M12 16V9M17 16v-6"/>',
  check: '<path d="M5 12l5 5 9-10"/>', cross: '<path d="M6 6l12 12M18 6L6 18"/>'};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
// Kestrel's mark (FICTIONAL): a hovering kestrel, copper on dark green. Source: ../design/kestrel-logo.svg
const LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="kt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#145a3e"/><stop offset="1" stop-color="#08291c"/></linearGradient><linearGradient id="kw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc870"/><stop offset="1" stop-color="#e2651c"/></linearGradient></defs><rect width="64" height="64" rx="17" fill="url(#kt)"/><g transform="translate(3.84 4.2) scale(.88)"><path d="M32 16.8C30.9 16.8 30.2 18.4 30.2 20.3L29.8 22.6C22 21.6 12.5 19.2 5 16.8C10.8 24.2 19.6 31 29.4 34L26.6 44.2Q32 46.6 37.4 44.2L34.6 34C44.4 31 53.2 24.2 59 16.8C51.5 19.2 42 21.6 34.2 22.6L33.8 20.3C33.8 18.4 33.1 16.8 32 16.8Z" fill="url(#kw)"/></g></svg>';
function staticParts(){
  const K = D.product, G = D.customer, n = 0;
  document.getElementById('intro').innerHTML = `<div class="idc"><span class="tile logo">${LOGO}</span><div><b>${K}</b><span>An AI agent that answers customer support tickets</span></div></div>
    <div class="idc"><span class="tile t-p">${ic('page')}</span><div><b>This page</b><span>Its analytics and configuration page</span></div></div>`;
  document.getElementById('header').innerHTML = `
    <dt>${ic('customer')}Customer</dt><dd>${G}, payroll software for small businesses (~${fmt(Math.round(D.types.reduce((s, t) => s + t.tickets, 0) / 100) * 100)} support tickets a month)</dd>
    <dt>${ic('user')}User</dt><dd>Hannah Okafor, ${G}'s Head of Customer Support</dd>
    <dt>${ic('job')}Job to be done</dt><dd>Use ${K}'s performance data to decide which ticket types ${K} handles and which go to a human</dd>`;
  document.getElementById('headline').textContent = 'Monthly projection per current settings';
  document.getElementById('rules').innerHTML = `<table>
    <tr class="hdr"><th>Setting</th><th>Description</th><th>Recommended when</th></tr>
    <tr class="r-resolve"><td><span class="chip c-resolve">AI</span></td><td>${K} replies and resolves.</td><td data-label="Recommended when">Accuracy 98% or more, and a wrong answer is Easy to fix or Fixable.</td></tr>
    <tr class="r-draft"><td><span class="chip c-draft">AI-assisted human</span></td><td>${K} drafts; a support agent approves or edits.</td><td data-label="Recommended when">Accuracy 60% or more, whatever the impact, when not recommended for AI.</td></tr>
    <tr class="r-human"><td><span class="chip c-human">Human</span></td><td>Routed to a human agent.</td><td data-label="Recommended when">Accuracy below 60%: a draft would not save a support agent time and may confuse them instead.</td></tr></table>`;
  document.getElementById('measure').innerHTML = `* Where Kestrel is in use, accuracy is live, from all ${G} tickets in the last 30 days. A separate grading AI checks each answer against <a href="playbook.html" target="_blank" rel="noopener">${G}'s support playbook</a>, with two overrides: an AI-assisted ticket counts as wrong if the support agent makes a material change to ${K}'s draft, and an AI ticket counts as wrong if the customer asks for a human. Accuracy for ticket types not touched by AI in production is measured on a test run of 50 recent tickets, run daily. Verdicts you override replace the grading AI's in the accuracy.`;
  document.getElementById('footer').textContent = `Fictional example: ${K}, ${G} and all data are synthetic.`;
}
function render(){
  const n = 0, E = eff(), DE = Object.assign({}, D, {types: E}), s = summary(DE, settings), K = D.product;
  const recSet = E.map(t => recommend(t, n)), r = summary(DE, recSet), overrides = settings.filter((m, i) => m !== recSet[i]).length;
  const delta = (now, base, unit, goodUp) => { const d = now - base; if (Math.abs(d) < 0.05) return '';
    const good = goodUp ? d > 0 : d < 0; return `<div class="delta ${good ? 'd-up' : 'd-bad'}">${d > 0 ? '+' : '−'}${unit(Math.abs(d))} from recommended settings</div>`; };
  document.getElementById('dashHead').innerHTML = overrides ? `<span id="state" class="state state-over">${overrides} setting ${overrides === 1 ? 'override' : 'overrides'}</span>` : '';
  document.getElementById('summary').innerHTML = `
    <div class="card"><b id="sumShare">${(s.aiShare * 100).toFixed(1)}%</b><span>of tickets handled solely by AI (${fmt(s.ai)} of ${fmt(s.all)})</span>${delta(s.aiShare * 100, r.aiShare * 100, v => v.toFixed(1) + ' pts', true)}</div>
    <div class="card"><b id="sumHours">${fmt(s.hours)}</b><span>support hours saved (${D.minutes_ai} min saved per ticket fully handled by AI, ${D.minutes_assisted} per ticket partially handled by AI)</span>${delta(s.hours, r.hours, v => fmt(v) + ' hours', true)}</div>
    <div class="card"><b id="sumHigh" class="${s.wrongHigh >= 0.5 ? 'hi-bad' : ''}">${fmt(s.wrongHigh)}</b><span>wrong answers reaching customers on ticket types that are Hard to undo</span>${delta(s.wrongHigh, r.wrongHigh, v => fmt(v), false)}</div>`;
  flash([['sumShare', s.aiShare, true], ['sumHours', s.hours, true], ['sumHigh', s.wrongHigh, false]]);
  const rows = E.map((t, i) => {
    const rec = recommend(t, n), set = settings[i], isOpen = open.has(i), p = (accuracy(t, n) * 100).toFixed(t.tested === 50 ? 0 : 1), adj = t.risk !== D.types[i].risk;
    const over = set !== rec ? `<div><span class="tag">Setting overridden</span></div>` : '';
    const w = wrongPerMonth(t), warn = !aboveRecommended(t, n, set) ? '' : set === 'resolve'
      ? `<div class="warn">Riskier than recommended: about ${w} wrong ${w === 1 ? 'answer' : 'answers'} a month would reach customers with no one checking</div>`
      : `<div class="warn">Riskier than recommended: support agents would need to catch about ${w} wrong ${w === 1 ? 'draft' : 'drafts'} a month</div>`;
    const main = `<tr class="row${isOpen ? ' open' : ''}" data-i="${i}" onclick="toggle(${i})">
      <td><span class="chev">${isOpen ? '▾' : '▸'}</span><span class="name">${t.name}</span></td>
      <td class="n" data-label="Tickets a month">${fmt(t.tickets)}</td>
      <td data-label="Accuracy*" class="n acc ${accFlash[i] ? (accFlash[i] > 0 ? 'acc-up' : 'acc-down') : ''}">${accFlash[i] ? `<span class="accd">${accFlash[i] > 0 ? '▲ +' : '▼ −'}${Math.abs(accFlash[i]).toFixed(1)}</span>` : ''}${p}%<div class="sub">${t.tested === t.tickets ? '<span class="live-dot"></span>last 30 days' : "based on today's test run"}</div></td>
      <td data-label="Impact if wrong" onclick="event.stopPropagation()"><select class="ctl rk-${t.risk}" data-risk="${i}" onchange="setRisk(${i}, this.value)">${['Low', 'Medium', 'High'].map(v => `<option value="${v}"${v === t.risk ? ' selected' : ''}>${IMPACT[v]}</option>`).join('')}</select>${adj ? '<div class="adjusted">Adjusted by user</div>' : `<div class="sub">${t.risk_example.replace(/^\w+: /, '')}</div>`}</td>
      <td data-label="Recommendation"><span class="chip ctl c-${rec}">${LABEL[rec]}</span>${adj ? '' : `<div class="reason">${t.reason.replace(/\d+(\.\d)?%/, p + '%')}</div>`}</td>
      <td data-label="Setting" onclick="event.stopPropagation()"><select class="ctl s-${set}" data-i="${i}" onchange="setMode(${i}, this.value)">${['resolve', 'draft', 'human'].map(m => `<option value="${m}"${m === set ? ' selected' : ''}>${LABEL[m]}</option>`).join('')}</select>${over}${warn}</td>
</tr>`;
    const det = isOpen ? `<tr class="detail"><td colspan="6"><div class="exhead">Recent tickets</div><div class="exgrid">${t.examples.map((e, k) => { const key = `${i}-${k}`, o = ovr[key], ok = o ? o.correct : e.correct; return `<div class="exbox ${ok ? 'ex-ok' : 'ex-no'}" data-ex="${key}"><div class="exbody">
      <div class="chat"><div class="chathead"><span class="dot"></span>${D.channel}</div><div class="chatbody">
      <div class="msg-in"><span class="who">${ic('chat')}Customer request</span><div class="bubble">${e.message}</div></div>
      <div class="msg-out"><span class="who">${ic('spark')}${K} proposed</span><div class="bubble">${e.proposed}</div></div></div></div>
      </div>
      <div class="verdict"><span class="who">Evaluation (grading AI)</span>
        <div class="rulebox"><span class="who">${ic('book')}Customer support rule · <a class="rule-link" href="playbook.html#${e.rule_id}" target="_blank" rel="noopener" title="Open this rule in ${D.customer}'s support playbook">${e.rule_id}</a></span>${e.rule}</div>
        <div class="vline"><span class="pill ${ok ? 'ok' : 'no'}">${ic(ok ? 'check' : 'cross')}${ok ? 'Correct' : 'Wrong'}</span>${o ? '<span class="tag">Verdict overridden</span>' : e.verdict_reason}${o ? `<div class="ovr-note">${o.reason ? `<b>Your reason:</b> ${esc(o.reason)}` : '<i>No reason given.</i>'}<div class="vtools"><button class="link" onclick="openOverride(${i}, ${k}, this)">Edit</button>${o.reason ? ` · <button class="link" onclick="removeReason(${i}, ${k})">Remove reason</button>` : ''} · <button class="link" onclick="undoOverride(${i}, ${k})">Undo override</button></div><div class="ai-said">Grading AI said ${e.correct ? 'Correct' : 'Wrong'}: ${e.verdict_reason}</div></div>` : `<div class="vtools"><button class="link" onclick="openOverride(${i}, ${k}, this)" aria-label="Override the grading AI's verdict">Override verdict</button></div>`}</div></div></div>`; }).join('')}</div></td></tr>` : '';
    return main + det; }).join('');
  document.getElementById('types').innerHTML = `<tr class="hdr"><th>Ticket type</th><th class="n">Tickets a month</th><th class="n" id="thAcc"><span id="thAccLabel">Accuracy*</span></th><th>Impact if wrong</th><th>Recommendation</th><th>Setting</th></tr>${rows}`;
}
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const verdictOf = (i, k) => { const o = ovr[`${i}-${k}`]; return o ? o.correct : D.types[i].examples[k].correct; };
// an overridden verdict counts in accuracy: the type moves by one ticket; the setting follows the recommendation only if it was on it
function applyVerdict(i, k, change){ const before = recommend(eff()[i], 0), was = verdictOf(i, k); change();
  liveCorrect[i] += (verdictOf(i, k) ? 1 : 0) - (was ? 1 : 0);
  const after = recommend(eff()[i], 0); if (settings[i] === before) settings[i] = after; render();
  return after !== before ? ` Now recommended: ${LABEL[after]}.` : ''; }
const accText = i => `${(accuracy(eff()[i]) * 100).toFixed(D.types[i].tested === 50 ? 0 : 1)}%`;
function openOverride(i, k, btn){ closeOverride();
  const e = D.types[i].examples[k], o = ovr[`${i}-${k}`], to = o ? o.correct : !e.correct, V = c => c ? 'Correct' : 'Wrong';
  const back = document.createElement('div'); back.className = 'ovr-back'; back.id = 'ovrBack'; back.style.height = document.documentElement.scrollHeight + 'px'; back.onclick = closeOverride;
  const dlg = document.createElement('div'); dlg.className = 'ovr'; dlg.id = 'ovr';
  dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true'); dlg.setAttribute('aria-labelledby', 'ovrTitle');
  dlg.innerHTML = `<h3 id="ovrTitle">${o ? 'Edit your override' : 'Override the grading AI'}</h3>
    <p>The grading AI said <b class="${e.correct ? 'ok' : 'no'}">${V(e.correct)}</b>. ${o ? 'You changed it to' : 'Change it to'} <b class="${to ? 'ok' : 'no'}">${V(to)}</b>${o ? '' : `, which counts in ${esc(D.types[i].name)}'s accuracy`}.</p>
    <label for="ovrReason">Reason <span class="opt">(optional, shown on the ticket)</span></label>
    <textarea id="ovrReason" rows="3" placeholder="What did the grading AI miss?">${o ? esc(o.reason) : ''}</textarea>
    <div class="ovr-actions"><button class="btn2" onclick="closeOverride()">Cancel</button><button class="apply" id="ovrSave" onclick="saveOverride(${i}, ${k}, ${to})">${o ? 'Save' : 'Change to ' + V(to)}</button></div>`;
  document.body.append(back, dlg);
  const r = btn.getBoundingClientRect(), w = dlg.offsetWidth;
  dlg.style.top = (window.scrollY + r.bottom + 8) + 'px';
  dlg.style.left = Math.max(12, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - w - 12)) + 'px';
  dlg.scrollIntoView({block: 'nearest'}); document.getElementById('ovrReason').focus(); }
function closeOverride(){ ['ovr', 'ovrBack'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); }); }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeOverride(); });
function saveOverride(i, k, to){ const key = `${i}-${k}`, reason = document.getElementById('ovrReason').value.trim(), editing = !!ovr[key];
  const rec = applyVerdict(i, k, () => { ovr[key] = {correct: to, reason}; }); closeOverride();
  toast(editing ? 'Reason saved.' : `Verdict changed to ${to ? 'Correct' : 'Wrong'}. Accuracy now ${accText(i)}.${rec}`, `.exbox[data-ex="${key}"] .vline`); }
function removeReason(i, k){ const key = `${i}-${k}`; ovr[key].reason = ''; render(); toast('Reason removed.', `.exbox[data-ex="${key}"] .vline`); }
function undoOverride(i, k){ const key = `${i}-${k}`; const rec = applyVerdict(i, k, () => { delete ovr[key]; });
  toast(`Back to the grading AI's verdict. Accuracy now ${accText(i)}.${rec}`, `.exbox[data-ex="${key}"] .vline`); }
function toggle(i){ open.has(i) ? open.delete(i) : open.add(i); render(); }
// colour a card for a moment when its number changes: green if the change is good, red if not
let last = null;
function flash(items){
  const now = {};
  items.forEach(([id, v, goodUp]) => { now[id] = v;
    if (!last || Math.abs(last[id] - v) < 1e-9) return;
    const el = document.getElementById(id), card = el.closest('.card'), up = v > last[id], good = goodUp ? up : !up;
    card.insertAdjacentHTML('beforeend', `<span class="arrow">${up ? '▲' : '▼'}</span>`);
    card.classList.add(good ? 'flash-good' : 'flash-bad');
    setTimeout(() => { card.classList.remove('flash-good', 'flash-bad'); card.querySelectorAll('.arrow').forEach(a => a.remove()); }, 1600); });
  last = now; }
let toastTimer;
function toast(msg, anchor){ const old = document.getElementById('toast'); if (old) old.remove();
  const a = anchor && document.querySelector(anchor); if (!a) return;
  const el = document.createElement('div'); el.id = 'toast'; el.className = 'inline-ok show'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="tick">✓</span>${msg}`;
  if (anchor === '#applyAll') a.insertAdjacentElement('beforebegin', el); else a.insertAdjacentElement('afterend', el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600); }
function setMode(i, m){ settings[i] = m; render(); toast(`Saved. Projection updated.`, `select[data-i="${i}"]`); }
// changing risk re-runs the recommendation; the setting follows it only if it was still on the old recommendation
function setRisk(i, v){ const n = 0, before = recommend(eff()[i], n); risks[i] = v;
  const after = recommend(eff()[i], n); if (settings[i] === before) settings[i] = after; render();
  toast(`Saved. ${after !== before ? 'Now recommended: ' + LABEL[after] + '.' : 'Recommendation unchanged.'}`, `select[data-risk="${i}"]`); }
function applyAll(silent){ settings = eff().map(t => recommend(t, 0)); render(); if (!silent) toast('All recommendations applied. Projection updated.', '#applyAll'); }
// one live type's accuracy moves by one ticket; stays within 2 tickets of the 30-day figure and never changes a recommendation
function tick(){
  const busy = document.getElementById('toast') || document.getElementById('ovr') || (document.activeElement && document.activeElement.tagName === 'SELECT');
  if (busy) return false;  // don't redraw under someone mid-change
  const wts = tickerWeights(D.types), tot = wts.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot, i = 0; while (r >= wts[i] || !wts[i]) { r -= wts[i]; i++; }
  const t = D.types[i], ok = c => c >= t.correct - 2 && c <= Math.min(t.tested, t.correct + 2) &&
    recommend(Object.assign({}, t, {risk: risks[i], correct: c}), 0) === recommend(eff()[i], 0);
  const step = Math.random() < 0.5 ? 1 : -1, c = [liveCorrect[i] + step, liveCorrect[i] - step].find(ok);
  if (c === undefined) return false;
  accFlash = {[i]: (c - liveCorrect[i]) / t.tested * 100}; liveCorrect[i] = c; render();
  setTimeout(() => { accFlash = {}; document.querySelectorAll('td.acc-up, td.acc-down').forEach(td => { td.classList.remove('acc-up', 'acc-down'); td.querySelectorAll('.accd').forEach(x => x.remove()); }); }, 2200);
  return true; }
window.tick = tick;
fetch('../data/ticket_types.json').then(r => r.json()).then(d => { D = d; risks = D.types.map(t => t.risk); liveCorrect = D.types.map(t => t.correct); staticParts();
  // saved settings: one setting override, a cautious one (Update company address moved down from AI to AI-assisted human)
  settings = eff().map(t => recommend(t, 0)); settings[D.types.findIndex(t => t.name === 'Update company address')] = 'draft'; render();
  document.body.dataset.ready = '1';
  // live accuracy: every 5 seconds from load, one ticket type updates (off with ?static=1, for checks and screenshots)
  if (new URLSearchParams(location.search).has('static')) document.body.classList.add('static'); else setInterval(tick, 5000); })
  .catch(() => { document.querySelector('main').insertAdjacentHTML('afterbegin', '<p class="measure"><b>Couldn\'t load the data.</b> Open this page through a web server, not by double-clicking the file.</p>'); });
</script>
