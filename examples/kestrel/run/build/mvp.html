<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kestrel analytics and configuration (fictional example)</title>
<!-- FICTIONAL example: Kestrel, Gusta and all data are synthetic. -->
<style>
:root{--text:#343a40;--head:#212529;--mute:#6c757d;--line:#e6e8eb;--bg:#f9f9fa;--ai-bg:#e7f6ee;--ai:#1c7a4f;--mix-bg:#fff4e0;--mix:#9a5b00;--hum-bg:#fde8ea;--hum:#b4232f;--open:#f4f7f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}
main{max-width:1240px;margin:0 auto;padding:24px 24px 36px}
.header{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:15px;margin:0 0 20px;padding:16px 18px;background:#eaf1f8;border:1px solid #d3e0ee;border-radius:8px}
.header dt{color:#3f5b78;font-weight:600}.header dd{margin:0;color:var(--head)}
h1{font-size:28px;color:var(--head);margin:0 0 16px}
.dash-head{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:13px;color:var(--mute)}
.dash-head b{color:var(--head);font-size:13px}
.dyn{font-size:12px;color:var(--mute)}
.state{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}.state-rec{background:var(--ai-bg);color:var(--ai)}.state-over{background:var(--mix-bg);color:var(--mix)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.delta{font-size:12px;font-weight:600;margin-top:4px}.d-up{color:var(--ai)}.d-bad{color:var(--hum)}.d-none{color:var(--mute);font-weight:400}
.card b.hi-bad{color:var(--hum)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card b{display:block;font-size:28px;color:var(--head);font-variant-numeric:tabular-nums}
.card span{color:var(--mute);font-size:13px}
.rules{margin-bottom:14px}
.rules table td{font-size:13px;line-height:1.45;padding:9px 12px}
.rules table td:first-child{width:170px}
.rules table td:nth-child(2){width:38%}
.rules tr.r-resolve td:first-child{box-shadow:inset 3px 0 0 var(--ai)}.rules tr.r-draft td:first-child{box-shadow:inset 3px 0 0 var(--mix)}.rules tr.r-human td:first-child{box-shadow:inset 3px 0 0 var(--hum)}
.chip{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap}
.c-resolve{background:var(--ai-bg);color:var(--ai)}.c-draft{background:var(--mix-bg);color:var(--mix)}.c-human{background:var(--hum-bg);color:var(--hum)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 10px}
.measure{font-size:13px;color:var(--mute);margin:0}
button.apply{font:inherit;font-size:13px;font-weight:600;background:#0f766e;color:#fff;border:1px solid #0f766e;border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.apply:hover{background:#0b5f59}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover{background:#f6f8f9}tr.row.open{background:var(--open)}
.name{font-weight:600;color:var(--head)}.chev{color:var(--mute);display:inline-block;width:12px}
.risk{white-space:nowrap;font-weight:600}.risk-Low{color:var(--ai)}.risk-Medium{color:var(--mix)}.risk-High{color:var(--hum)}
.sub{font-size:12px;color:var(--mute)}
.reason{font-size:12px;color:var(--mute);line-height:1.4;margin-top:5px;max-width:240px}
select{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;color:var(--head);cursor:pointer}
select.s-resolve{background:var(--ai-bg);color:var(--ai);border-color:#a8dcc0}select.s-draft{background:var(--mix-bg);color:var(--mix);border-color:#f2d39b}select.s-human{background:var(--hum-bg);color:var(--hum);border-color:#f5b5bd}
select option{background:#fff;color:var(--head);font-weight:400}
select.rk-Low{color:var(--ai);border-color:#a8dcc0}select.rk-Medium{color:var(--mix);border-color:#f2d39b}select.rk-High{color:var(--hum);border-color:#f5b5bd}
.adjusted{font-size:12px;color:var(--mix);font-weight:600;margin-top:5px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:#eef0f2;color:var(--mute);margin-top:4px}
.warn{font-size:12px;color:var(--hum);margin-top:4px}
tr.detail td{background:var(--open);padding:2px 10px 14px 32px}
.exhead{font-size:12px;font-weight:600;color:var(--head);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 8px}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.exbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.exbox p{margin:0 0 7px}.exbox p:last-child{margin:0}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute)}
.ok{color:var(--ai);font-weight:600}.no{color:var(--hum);font-weight:600}
.toast{position:fixed;right:24px;bottom:24px;background:var(--head);color:#fff;font-size:13px;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:none}.toast .tick{color:#7ee2b0;font-weight:700;margin-right:6px}
footer{margin-top:24px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:900px){.summary,.exgrid{grid-template-columns:1fr}.hide-sm{display:none}main{padding:16px}.header{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start}}
</style></head><body>
<main>
<dl class="header" id="header"></dl>
<h1 id="headline"></h1>
<div class="dash-head" id="dashHead"></div>
<div class="summary" id="summary"></div>
<div class="panel rules" id="rules"></div>
<div class="bar"><p class="measure" id="measure"></p><button class="apply" id="applyAll" onclick="applyAll()">Apply all recommendations</button></div>
<div class="panel"><table id="types"></table></div>
<footer id="footer"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script id="calc">
// ---- Every number is calculated here. Plain functions, tested in test_mvp.js ----
// modes: 'resolve' = AI, 'draft' = AI-assisted human, 'human' = Human
const RANK = {human: 0, draft: 1, resolve: 2};
function accuracy(t, n){ return t.correct / n; }
function recommend(t, n){
  const a = accuracy(t, n), high = t.risk === 'High';
  if (a >= 0.98 && !high) return 'resolve';
  if ((a >= 0.90 && !high) || (a >= 0.98 && high)) return 'draft';
  return 'human';
}
// settings: one mode per type (defaults to the recommendation)
function summary(d, settings){
  const n = d.test_tickets_per_type, all = d.types.reduce((s, t) => s + t.tickets, 0);
  let ai = 0, assisted = 0, wrong = 0, wrongHigh = 0;
  d.types.forEach((t, i) => { const m = settings[i];
    if (m === 'resolve'){ const w = t.tickets * (1 - accuracy(t, n)); ai += t.tickets; wrong += w; if (t.risk === 'High') wrongHigh += w; }
    if (m === 'draft') assisted += t.tickets; });
  return {all, ai, assisted, aiShare: ai / all, hours: (ai * d.minutes_ai + assisted * d.minutes_assisted) / 60, wrong, wrongHigh};
}
function aboveRecommended(t, n, mode){ return RANK[mode] > RANK[recommend(t, n)]; }
if (typeof module !== 'undefined') module.exports = {accuracy, recommend, summary, aboveRecommended, RANK};
</script>

<script>
const LABEL = {resolve: 'AI', draft: 'AI-assisted human', human: 'Human'};
let D, settings = [], risks = [], open = new Set([0]);
const eff = () => D.types.map((t, i) => Object.assign({}, t, {risk: risks[i]}));
const fmt = v => Math.round(v).toLocaleString('en-GB');
function staticParts(){
  const K = D.product, G = D.customer, n = D.test_tickets_per_type;
  document.getElementById('header').innerHTML = `
    <dt>${K}</dt><dd>An AI agent that answers support tickets in ${G}'s in-app chat</dd>
    <dt>This page</dt><dd>Its analytics and configuration page</dd>
    <dt>Customer</dt><dd>${G}, payroll software for small businesses (~${fmt(Math.round(D.types.reduce((s, t) => s + t.tickets, 0) / 100) * 100)} support tickets a month)</dd>
    <dt>User</dt><dd>${G}'s Head of Customer Support</dd>
    <dt>Job to be done</dt><dd>Use ${K}'s performance data to decide which ticket types it handles on its own</dd>`;
  document.getElementById('headline').textContent = 'Monthly projection based on current settings';
  document.getElementById('rules').innerHTML = `<table>
    <tr><th>Setting</th><th>Description</th><th>Recommended when</th></tr>
    <tr class="r-resolve"><td><span class="chip c-resolve">AI</span></td><td>${K} replies and resolves.</td><td>Accuracy 98% or more, and risk Low or Medium.</td></tr>
    <tr class="r-draft"><td><span class="chip c-draft">AI-assisted human</span></td><td>${K} drafts; a support agent approves or edits.</td><td>Accuracy 90% or more and risk Low or Medium, or accuracy 98% or more and risk High.</td></tr>
    <tr class="r-human"><td><span class="chip c-human">Human</span></td><td>Routed to a human agent.</td><td>Everything else.</td></tr></table>`;
  document.getElementById('measure').textContent = `How accuracy is measured: ${K} was run on ${n} past ${G} tickets per type. Each answer was checked against ${G}'s support playbook by a separate grading AI.`;
  document.getElementById('footer').textContent = `Fictional example: ${K}, ${G} and all data are synthetic.`;
}
function render(){
  const n = D.test_tickets_per_type, E = eff(), DE = Object.assign({}, D, {types: E}), s = summary(DE, settings), K = D.product;
  const recSet = E.map(t => recommend(t, n)), r = summary(DE, recSet), overrides = settings.filter((m, i) => m !== recSet[i]).length;
  const delta = (now, base, unit, goodUp) => { const d = now - base; if (Math.abs(d) < 0.05) return '';
    const good = goodUp ? d > 0 : d < 0; return `<div class="delta ${good ? 'd-up' : 'd-bad'}">${d > 0 ? '+' : '−'}${unit(Math.abs(d))} vs recommended</div>`; };
  document.getElementById('dashHead').innerHTML = overrides ? `<span id="state" class="state state-over">${overrides} ${overrides === 1 ? 'override' : 'overrides'} from Kestrel's recommendation</span>` : '';
  document.getElementById('summary').innerHTML = `
    <div class="card"><b id="sumShare">${(s.aiShare * 100).toFixed(1)}%</b><span>of tickets handled by AI (${fmt(s.ai)} of ${fmt(s.all)})</span>${delta(s.aiShare * 100, r.aiShare * 100, v => v.toFixed(1) + ' pts', true)}</div>
    <div class="card"><b id="sumHours">${fmt(s.hours)}</b><span>support hours saved (${D.minutes_ai} min saved per ticket fully handled by AI, ${D.minutes_assisted} per ticket partially handled by AI)</span>${delta(s.hours, r.hours, v => fmt(v) + ' hours', true)}</div>
    <div class="card"><b id="sumHigh" class="${s.wrongHigh >= 0.5 ? 'hi-bad' : ''}">${fmt(s.wrongHigh)}</b><span>wrong answers on high-risk type tickets reaching customers</span>${delta(s.wrongHigh, r.wrongHigh, v => fmt(v), false)}</div>`;
  const rows = E.map((t, i) => {
    const rec = recommend(t, n), set = settings[i], isOpen = open.has(i), p = Math.round(accuracy(t, n) * 100), adj = t.risk !== D.types[i].risk;
    const over = set !== rec ? `<div><span class="tag">Overridden</span></div>` : '';
    const warn = aboveRecommended(t, n, set) ? `<div class="warn">Above recommended: ${p}% accurate on a ${t.risk}-risk type</div>` : '';
    const main = `<tr class="row${isOpen ? ' open' : ''}" data-i="${i}" onclick="toggle(${i})">
      <td><span class="chev">${isOpen ? '▾' : '▸'}</span><span class="name">${t.name}</span></td>
      <td class="n">${fmt(t.tickets)}</td>
      <td class="n">${p}% <span class="sub">(${t.correct}/${n})</span></td>
      <td onclick="event.stopPropagation()"><select class="rk-${t.risk}" data-risk="${i}" onchange="setRisk(${i}, this.value)">${['Low', 'Medium', 'High'].map(v => `<option${v === t.risk ? ' selected' : ''}>${v}</option>`).join('')}</select>${adj ? '<div class="adjusted">Adjusted by user</div>' : `<div class="sub">${t.risk_example.replace(/^\w+: /, '')}</div>`}</td>
      <td><span class="chip c-${rec}">${LABEL[rec]}</span>${adj ? '' : `<div class="reason">${t.reason}</div>`}</td>
      <td onclick="event.stopPropagation()"><select class="s-${set}" data-i="${i}" onchange="setMode(${i}, this.value)">${['resolve', 'draft', 'human'].map(m => `<option value="${m}"${m === set ? ' selected' : ''}>${LABEL[m]}</option>`).join('')}</select>${over}${warn}</td>
</tr>`;
    const det = isOpen ? `<tr class="detail"><td colspan="6"><div class="exhead">Example tickets</div><div class="exgrid">${t.examples.map(e => `<div class="exbox">
      <p><span class="lbl">Customer message</span>“${e.message}”</p>
      <p><span class="lbl">${K} proposed</span>${e.proposed}</p>
      <p><span class="lbl">Customer support rule</span>${e.rule}</p>
      <p><span class="lbl">Verdict (grading AI)</span><span class="${e.correct ? 'ok">Correct' : 'no">Wrong'}</span>: ${e.verdict_reason}</p></div>`).join('')}</div></td></tr>` : '';
    return main + det; }).join('');
  document.getElementById('types').innerHTML = `<tr><th>Ticket type</th><th class="n">Tickets a month</th><th class="n">Accuracy</th><th>Risk if wrong</th><th>Recommendation</th><th>Setting</th></tr>${rows}`;
}
function toggle(i){ open.has(i) ? open.delete(i) : open.add(i); render(); }
let toastTimer;
function toast(msg){ const el = document.getElementById('toast'); el.innerHTML = `<span class="tick">✓</span>${msg}`; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500); }
function setMode(i, m){ settings[i] = m; render(); toast(`${D.types[i].name} set to ${LABEL[m]}. Projection updated.`); }
// changing risk re-runs the recommendation; the setting follows it only if it was still on the old recommendation
function setRisk(i, v){ const n = D.test_tickets_per_type, before = recommend(eff()[i], n); risks[i] = v;
  const after = recommend(eff()[i], n); if (settings[i] === before) settings[i] = after; render();
  toast(`${D.types[i].name} risk set to ${v}. ${after !== before ? 'Now recommended: ' + LABEL[after] + '.' : 'Recommendation unchanged.'}`); }
function applyAll(silent){ settings = eff().map(t => recommend(t, D.test_tickets_per_type)); render(); if (!silent) toast('All recommendations applied. Projection updated.'); }
fetch('../data/ticket_types.json').then(r => r.json()).then(d => { D = d; risks = D.types.map(t => t.risk); staticParts(); applyAll(true); settings[D.types.findIndex(t => t.name === 'Change bank details')] = 'human'; render(); document.body.dataset.ready = '1'; })
  .catch(() => { document.querySelector('main').insertAdjacentHTML('afterbegin', '<p class="measure"><b>Couldn\'t load the data.</b> Open this page through a web server, not by double-clicking the file.</p>'); });
</script>
</body></html>
