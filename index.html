<script>
// size the embedded prototype to its content, and keep it sized as rows open and close
const f = document.getElementById('demo');
f.addEventListener('load', () => { const d = f.contentDocument, fit = () => { f.style.height = Math.ceil(d.body.getBoundingClientRect().height) + 'px'; };
  fit(); new ResizeObserver(fit).observe(d.body); });
